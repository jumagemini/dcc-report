{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4">
        <h2 class="mb-4">🔐 Sign In</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary w-100">Login</button>
        </form>
        <div class="mt-3 text-muted">
            <small>Only authorised users can access the dashboard.<br>Contact the administrator for access.</small>
        </div>
    </div>
</div>
{% endblock %}
